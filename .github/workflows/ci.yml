name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logbook_owner
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: logbook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logbook_owner" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://logbook_owner:dev@localhost:5432/logbook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
