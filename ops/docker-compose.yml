# Local or single-site installation: app + PostgreSQL 16.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: logbook_owner
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: logbook
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logbook_owner -d logbook"]
      interval: 5s
      retries: 10
  app:
    build: { context: .., dockerfile: ops/Dockerfile }
    environment:
      DATABASE_URL: postgres://logbook_owner:${DB_PASSWORD:-change-me}@db:5432/logbook
      # Single-box setup: the owner login switches to the restricted role for all app queries.
      DB_APP_ROLE: logbook_app
      # Voice notes (D-26): put SARVAM_API_KEY in ops/.env (git-ignored). Unset = voice notes off.
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
volumes:
  dbdata:
